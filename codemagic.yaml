workflows:
  android-workflow:
    name: Android Simple Calculator Workflow
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      groups:
        - default_group
      vars:
        JAVA_VERSION: "17"
      ndk: latest
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
